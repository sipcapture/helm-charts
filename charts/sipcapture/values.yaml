global:
  create_namespace: true
  security:
    allowInsecureImages: true
grafana:
  installOnCluster: true
  ingress:
    enabled: true # Disable if ingress controller absent or want to deploy using nodeport service only
    annotations:
      kubernetes.io/ingress.class: "nginx"
    hosts:
      - grafana.myimaginaryhost.com

  service:
    type: "NodePort"

  adminUser: admin
  adminPassword: "admin"

  sidecar:
    datasources:
      enabled: true
    dashboards:
      enabled: true

  persistence:
    enabled: true
    size: 2Gi

heplifyServer:
  image:
    registry: ghcr.io
    repository: sipcapture/heplify-server
    tag: latest
    pullPolicy: IfNotPresent
    pullSecrets: []
  service:
    type: ClusterIP
    ports:
      udp: 9060
      tcp: 9096
    # Configure nodePorts if you choose to run with NodePort service type
    #nodePorts:
    #  udp: 30001
    sessionAffinity: None
    sessionAffinityConfig: {}
    clusterIP: "None"
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
    externalTrafficPolicy: Cluster
    annotations: {}
    extraPorts: []
  serviceMonitor:
    enabled: false
    scrapeInterval: 15s
    scrapeTimeout: 15s
  config:
    dbDropDays: 14
    dbDropDaysCall: 0
    dbDropDaysRegister: 0
    dbDropDaysDefault: 0
    dbDropOnStart: false
    dbBuffer: 400000
    dbBulk: 400
    dbMaxSize: 20000000000
    dbPartIsup: "6h"
    dbPartLog: "2h"
    dbPartQos: "6h"
    dbPartSip: "2h"
    dbPercentageUsage: 80
    dbProcDropLimit: 2
    dbRotate: true
    dbTimer: 4
    dbUsageProtection: false
    dbUsageScheme: "percentage"
    dbWorker: 8

influxdb:
  installOnCluster: true
  image:
    registry: docker.io
    repository: influxdb
    tag: 1.8
    pullPolicy: IfNotPresent
    pullSecrets: []
  loglevel: info
  storage: 10Gi

homer:
  image:
    registry: ghcr.io
    repository: sipcapture/homer-app
    tag: latest
    pullPolicy: IfNotPresent
    pullSecrets: []
  service:
    type: ClusterIP
    ports:
      http: 80
    # Configure nodePorts if you choose to run with NodePort service type
    #nodePorts:
    #  http: 8080
    sessionAffinity: None
    sessionAffinityConfig: {}
    clusterIP: "None"
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
    externalTrafficPolicy: Cluster
    annotations: {}
    extraPorts: []
  ingress:
    enabled: true # Disable if ingress controller absent or want to deploy using nodeport service only
    hostname: webapp.myimaginaryhost.com
    annotations:
      kubernetes.io/ingress.class: "nginx"
    #tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local
  auth:
    oauth:
      enabled: false
      client_id: ""
      client_secret: ""
      project_id: ""
      auth_uri: ""
      token_uri: ""
      auth_provider_x509_cert_url: ""
      redirect_uri: ""
      service_redirect: ""
      profile_url: ""
      user_token: ""
      provider_name: ""
      provider_image: ""
      scope:
        - email
        - openid
        - profile

postgresql:
  installOnCluster: true
  image:
    repository: bitnamilegacy/postgresql
  fullnameOverride: "sipcapture-postgresql"
  auth:
    postgresPassword: "homerSeven"
    persistence:
      size: 30Gi

telegraf:
  installOnCluster: true
  image:
    registry: docker.io
    repository: telegraf
    tag: 1.19
    pullPolicy: IfNotPresent
    pullSecrets: []

# -- Array of extra K8s manifests to deploy
## Note: Supports use of custom Helm templates
extraObjects: []