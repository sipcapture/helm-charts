{{- if .Values.homer.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "homer.fullname" . }}
  {{- if .Values.homer.ingress.annotations }}
  annotations:
    {{- toYaml .Values.homer.ingress.annotations | nindent 4 }}
  {{- end }}
  namespace: {{ dig "global" "monitoring" "namespace" .Release.Namespace (.Values | merge (dict)) | quote }}
  labels:
{{ include "common.labels" . | indent 4 }}
spec:
  {{- if .Values.homer.ingress.tls }}
  tls:
    {{- range .Values.homer.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  {{- if .Values.homer.ingress.ingressClassName }}
  ingressClassName: {{ .Values.homer.ingress.ingressClassName }}
  {{- end }}
  rules:
    - host: {{ required "hostname for the homer portal" .Values.homer.ingress.hostname }}
      http:
        paths:
        - backend:
            service:
              name: {{ include "homer.fullname" . }}
              port:
                number: 80
          path: /
          pathType: Prefix
{{- end }}