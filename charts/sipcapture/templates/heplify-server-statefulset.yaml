apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "heplify.fullname" . }}
  labels:
    app:  {{ include "heplify.fullname" . }}
{{ include "common.labels" . | indent 4 }}
spec:
  serviceName: heplify-server
  replicas: 1
  selector:
    matchLabels:
      app:  {{ include "heplify.fullname" . }}
  template:
    metadata:
      labels:
        app:  {{ include "heplify.fullname" . }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/heplify-server-configmap.yaml") . | sha256sum }}
    spec:
      {{- include "heplifyServer.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.heplifyServer.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.heplifyServer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.heplifyServer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.heplifyServer.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: heplify-server
          {{- with .Values.heplifyServer.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.heplifyServer.image.registry }}/{{ .Values.heplifyServer.image.repository }}:{{ .Values.heplifyServer.image.tag }}"
          imagePullPolicy: {{ .Values.heplifyServer.image.pullPolicy }}
          args:
            - './heplify-server'
            - '-config'
            - '/etc/heplify-server.toml'
          env:
            - name: HEPLIFYSERVER_DBUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecretHomer }}
                  key: postgres-user
            - name: HEPLIFYSERVER_DBPASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecretHomer }}
                  key: postgres-password
            - name: HEPLIFYSERVER_DBDROPDAYS
              value: {{ .Values.heplifyServer.config.dbDropDays | quote }}
            - name: HEPLIFYSERVER_DBDROPDAYSCALL
              value: {{ .Values.heplifyServer.config.dbDropDaysCall | quote }}
            - name: HEPLIFYSERVER_DBDROPDAYSREGISTER
              value: {{ .Values.heplifyServer.config.dbDropDaysRegister | quote }}
            - name: HEPLIFYSERVER_DBDROPDAYSDEFAULT
              value: {{ .Values.heplifyServer.config.dbDropDaysDefault | quote }}
            - name: HEPLIFYSERVER_DBDROPONSTART
              value: {{ .Values.heplifyServer.config.dbDropOnStart | quote }}
            - name: HEPLIFYSERVER_DBBUFFER
              value: {{ .Values.heplifyServer.config.dbBuffer | quote }}
            - name: HEPLIFYSERVER_DBBULK
              value: {{ .Values.heplifyServer.config.dbBulk | quote }}
            - name: HEPLIFYSERVER_DBMAXSIZE
              value: {{ .Values.heplifyServer.config.dbMaxSize | quote }}
            - name: HEPLIFYSERVER_DBPARTISUP
              value: {{ .Values.heplifyServer.config.dbPartIsup | quote }}
            - name: HEPLIFYSERVER_DBPARTLOG
              value: {{ .Values.heplifyServer.config.dbPartLog | quote }}
            - name: HEPLIFYSERVER_DBPARTQOS
              value: {{ .Values.heplifyServer.config.dbPartQos | quote }}
            - name: HEPLIFYSERVER_DBPARTSIP
              value: {{ .Values.heplifyServer.config.dbPartSip | quote }}
            - name: HEPLIFYSERVER_DBPERCENTAGEUSAGE
              value: {{ .Values.heplifyServer.config.dbPercentageUsage | quote }}
            - name: HEPLIFYSERVER_DBPROCDROPLIMIT
              value: {{ .Values.heplifyServer.config.dbProcDropLimit | quote }}
            - name: HEPLIFYSERVER_DBROTATE
              value: {{ .Values.heplifyServer.config.dbRotate | quote }}
            - name: HEPLIFYSERVER_DBTIMER
              value: {{ .Values.heplifyServer.config.dbTimer | quote }}
            - name: HEPLIFYSERVER_DBUSAGEPROTECTION
              value: {{ .Values.heplifyServer.config.dbUsageProtection | quote }}
            - name: HEPLIFYSERVER_DBUSAGESCHEME
              value: {{ .Values.heplifyServer.config.dbUsageScheme | quote }}
            - name: HEPLIFYSERVER_DBWORKER
              value: {{ .Values.heplifyServer.config.dbWorker | quote }}
            - name: HEPLIFYSERVER_LOGLVL
              value: {{ .Values.heplifyServer.config.logLevel | quote }}
            - name: HEPLIFYSERVER_LOGDBG
              value: {{ .Values.heplifyServer.config.logDbg | quote }}
          ports:
            - containerPort: 9060
              protocol: UDP
            - containerPort: 9096
              protocol: TCP
          {{- with .Values.heplifyServer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - mountPath: /etc/heplify-server.toml
              name: heplify-server-conf
              subPath: heplify-server.toml
      volumes:
      - name: heplify-server-conf
        configMap:
          name: heplify-server-conf
          items:
          - key: heplify-server.toml
            path: heplify-server.toml
