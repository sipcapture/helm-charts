{{- if .Values.influxdb.installOnCluster }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: {{ include "influxdb.fullname" . }}
{{ include "common.labels" . | indent 4 }}
  name: {{ include "influxdb.fullname" . }}
  namespace: {{ dig "global" "monitoring" "namespace" .Release.Namespace (.Values | merge (dict)) | quote }}
spec:
  serviceName: {{ include "influxdb.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "influxdb.fullname" . }}
  template:
    metadata:
      name: {{ include "influxdb.fullname" . }}
      labels:
        app: {{ include "influxdb.fullname" . }}
    spec:
      {{- include "influxdb.imagePullSecrets" . | nindent 6 }}
      containers:
        - image: "{{ .Values.influxdb.image.registry }}/{{ .Values.influxdb.image.repository }}:{{ .Values.influxdb.image.tag }}"
          imagePullPolicy: {{ .Values.influxdb.image.pullPolicy }}
          name: influxdb
          ports:
            - containerPort: 8086
          resources: {}
          volumeMounts:
            - mountPath: /var/lib/influxdb
              name: influxdb-claim
          livenessProbe:
            httpGet:
              path: /ping
              port: 8086
            initialDelaySeconds: 90
            timeoutSeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ping
              port: 8086
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5        
      restartPolicy: Always
  volumeClaimTemplates:
  - metadata:
      name: influxdb-claim
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: {{ .Values.influxdb.storage }}
{{- end }}
